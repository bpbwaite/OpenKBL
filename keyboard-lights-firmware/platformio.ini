; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = dev_seeed_xiao_esp32c3

[common]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_ldf_mode = chain
board_build.partitions = partitions.csv
build_src_filter = +<*> -<tests/>
test_ignore = test_hands ; plain C++ PC tests, built with g++ (see the file)
lib_deps =
	FastLED@3.9.15
	fortyseveneffects/MIDI Library@^5.0.2

[env:dev_seeed_xiao_esp32c3]
extends = common
build_flags =
	-DPCB_REVISION=0
	-DKBL_USB_MIDI_DEBUG  
	-DKBL_HAND_DEBUG ; flash a Key red when Color::Hands corrects its hand

[env:release_seeed_xiao_esp32c3]
extends = common
build_flags = 
	-DPCB_REVISION=0
	-DKBL_USB_MIDI_DEBUG

; Hardware Tests
; Finds the lowest brightness the LEDs show consistently.
; Flash this with: pio run -e brightness_floor -t upload
[env:brightness_floor]
extends = env:dev_seeed_xiao_esp32c3
build_src_filter = -<*> +<tests/brightness_floor.cpp> +<rotary_encoder.cpp>
