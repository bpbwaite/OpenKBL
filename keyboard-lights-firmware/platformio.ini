; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_ldf_mode = chain
build_src_filter = +<*> -<tests/>
test_ignore = test_hands ; plain C++ PC tests, built with g++ (see the file)
build_flags =
	-DPCB_REVISION=0
	-DKBL_USB_MIDI_DEBUG   ; uncomment to type MIDI commands over USB serial, and print notes received over midi
	-DKBL_HAND_DEBUG       ; uncomment to flash a Key red when Color::Hands corrects its hand
lib_deps =
	FastLED@3.9.15
	fortyseveneffects/MIDI Library@^5.0.2

; Hardware test: finds the lowest brightness the LEDs show consistently.
; Flash with: pio run -e brightness_floor -t upload
[env:brightness_floor]
extends = env:seeed_xiao_esp32c3
build_src_filter = -<*> +<tests/brightness_floor.cpp> +<rotary_encoder.cpp>
